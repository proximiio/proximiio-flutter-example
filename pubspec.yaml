name: proximiio_flutter_example
description: "Indoor positioning and the venue map with the Proximi.io Flutter SDK v6."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0
  # The iOS app uses the UIScene lifecycle (FlutterImplicitEngineDelegate).
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # The flutter_proximiio URL and ref must be the ones flutter_proximiio_map uses, or pub sees two
  # different packages.
  flutter_proximiio:
    git:
      url: https://github.com/proximiio/flutter-proximiio
      ref: 6.0.0-beta.1
  flutter_proximiio_map:
    git:
      url: https://github.com/proximiio/flutter-proximiio-map
      ref: 6.0.0-beta.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    # The iOS map library ships only as a Swift package.
    enable-swift-package-manager: true
